# =====================================================
# APPLICATION
# =====================================================
spring.application.name=CampusCareAI
server.port=8080

# =====================================================
# SUPABASE POSTGRESQL DATABASE
# =====================================================
spring.datasource.url=jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.lwavmughmorcgabochsr
spring.datasource.password=CampusCare098765432
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================
# JPA / HIBERNATE
# =====================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# CONNECTION POOL
# =====================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# =====================================================
# JWT
# =====================================================
jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =====================================================
# GEMINI AI
# =====================================================
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

# =====================================================
# SUPABASE STORAGE
# =====================================================
supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:complaint-images}

# =====================================================
# LOGGING
# =====================================================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE